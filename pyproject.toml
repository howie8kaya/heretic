[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heretic"
version = "0.1.0"
description = "A tool to identify and remove unused dependencies from your projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["dependencies", "unused", "cleanup", "package-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
heretic = "heretic.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/heretic"
Repository = "https://github.com/your-org/heretic"
Issues = "https://github.com/your-org/heretic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/heretic"]

[tool.ruff]
line-length = 88  # prefer black's default over 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/heretic --cov-report=term-missing"

[tool.coverage.run]
source = ["src/heretic"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
